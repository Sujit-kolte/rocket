  <script>
    document.querySelectorAll(".memory-card").forEach((card) => {
      card.addEventListener("click", () => {
        const isActive = card.classList.contains("active");
        document.body.classList.toggle("card-zoomed", !isActive);
        card.classList.toggle("active");

        const leftImg = card.querySelector(".pop-img.left");
        const rightImg = card.querySelector(".pop-img.right");

        if (!isActive) {
          leftImg.classList.add("show");
          rightImg.classList.add("show");
          leftImg.classList.remove("hidden");
          rightImg.classList.remove("hidden");
        } else {
          leftImg.classList.remove("show");
          rightImg.classList.remove("show");
          setTimeout(() => {
            leftImg.classList.add("hidden");
            rightImg.classList.add("hidden");
          }, 1000);
        }
      });
    });
  </script>
