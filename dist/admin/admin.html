<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/assets/oldblacklogo-BRLOJu6J.png" />
    <title>Admin Dashboard - STES Rocketry</title>
  <script type="module" crossorigin src="/assets/admin-DbMO3rTK.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-BTZbWwFi.css">
  <link rel="stylesheet" crossorigin href="/assets/style-DyP6e9XJ.css">
</head>

<body>
    <div class="page">
        <nav class="navbar">
            <div class="logo"><img src="/assets/oldlogo-D3zr-lpU.png" alt="" /></div>
            <div class="nav-center nav-links">
                <a href="../index.html">Home</a>
                <a href="../projects/projects.html" id="vehicle">Projects</a>
                <a href="../sponsors/sponsors.html">Sponsors</a>
                <a href="../members/members.html">Members</a>
                <!-- <a href="../archive/archive.html">Archive</a>-->
                <a href="../contact-us/contacus.html">Contact Us</a>
            </div>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </nav>
        <div class="side-menu">
            <a href="../index.html">Home</a>
            <a href="../projects/projects.html" id="vehicle">Projects</a>
            <a href="../sponsors/sponsors.html">Sponsors</a>
            <a href="../members/members.html">Members</a>
            <!-- <a href="../archive/archive.html">Archive</a>-->
            <a href="../contact-us/contacus.html">Contact Us</a>
        </div>

        <div class="overlay"></div>
        <!-- Login Section -->
        <div id="login-section" class="login-container">
            <div class="login-panel">
                <h1>Admin Login</h1>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="admin-email" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin-password" placeholder="**********">
                </div>
                <button class="btn-primary" id="login-btn" style="width: 100%;">Login to Dashboard</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            <div class="container">
                <div class="dashboard-header">
                    <h1>Admin Dashboard</h1>
                    <button class="btn-danger" id="logout-btn">Logout</button>
                </div>

                <div class="controls">
                    <select id="domain-select">
                        <option value="">Select Domain</option>
                        <option value="projects">Projects</option>
                        <option value="members">Members</option>
                        <option value="sponsors">Sponsors</option>
                        <option value="contact">Contact</option>
                        <option value="archive">Archive</option>
                    </select>
                    <button class="btn-success" id="add-new-btn">+ Add New</button>
                </div>

                <div id="cards-container">
                    <div class="empty-state">
                        <h3>Select a domain to view cards</h3>
                        <p>Choose a domain from the dropdown above</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal for Add/Edit -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Add New Item</h2>
                    <button class="close-btn" id="close-modal">&times;</button>
                </div>
                <form id="item-form">
                    <div id="form-fields"></div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Save</button>
                </form>
            </div>
        </div>
        <footer class="footer">
            <div class="footer-content">
                <span>© 2025 STES Rocketry</span>
                <a href="https://www.instagram.com/stesrocketry/" target="_blank">
                    <img src="/assets/insta-CHqCn_vz.png" alt="Instagram" class="social-icon"
                        style="height: 18px; width: 18px" />
                </a>
                <a href="https://www.youtube.com/@stesrocketryteam9672" target="_blank">
                    <img src="/assets/youtube-B6jboOVx.png" alt="YouTube" class="social-icon"
                        style="height: 18px; width: 18px" />
                </a>
                <a href="https://www.linkedin.com/company/stesrocketry/posts/?feedView=all" target="_blank">
                    <img src="/assets/linkedin-CLDz0y0f.png" alt="LinkedIn" class="social-icon"
                        style="height: 18px; width: 18px" />
                </a>
            </div>
        </footer>
    </div>
    <canvas id="stars"></canvas>
    <script src="../stars.js"></script>
</body>

</html>
