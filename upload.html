    <style>
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
            /* Deep dark blue/black */
            --panel-bg: #1e293b;
            /* Slightly lighter for cards/panels */
            --text-main: #f8fafc;
            /* Off-white for readability */
            --text-muted: #94a3b8;
            /* Gray for labels/placeholders */
            --border: #334155;
            /* Subtle border for separation */
            --input-bg: #0f172a;
            /* Darker input background */
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .admin-panel {
            max-width: 600px;
            margin: 0 auto;
            background: var(--panel-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

    <!-- GSAP Animations for New Layout -->
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Hero Reveal
        gsap.from(".hero-title", {
            y: 50,
            opacity: 0,
            duration: 1.0,
            ease: "power3.out",
            delay: 0.2
        });

        // Marquee Scroll Effect
        gsap.to(".inf-scroll-text", {
            xPercent: -50,
            ease: "none",
            scrollTrigger: {
                trigger: ".marquee-section",
                start: "top bottom",
                end: "bottom top",
                scrub: 1
            }
        });

        // Giant Text Parallax
        gsap.fromTo(".giant-text",
            { x: -400, opacity: 0.8 },
            {
                x: 400,
                opacity: 1,
                scrollTrigger: {
                    trigger: ".giant-text-section",
                    start: "top bottom",
                    end: "bottom top",
                    scrub: true
                }
            }
        );

        // Feature Section Reveal
        gsap.from(".feature-content", {
            y: 30,
            opacity: 0,
            duration: 0.8,
            scrollTrigger: {
                trigger: ".feature-split",
                start: "top 80%"
            }
        });

    </script>
