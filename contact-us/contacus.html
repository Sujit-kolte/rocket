    <div class="overlay"></div>
    <!-- Contact Section -->
    <div class="split-container">
      <!-- Left Side: Inspirational Text -->
      <div class="split-left">
        <div class="quote-content">
          <h1>Every Mission<br>Starts With A<br>Connection.</h1>
          <p>Reach out and waiting for signals.</p>
          <span class="dot">•</span>
        </div>
      </div>

      <!-- Right Side: Contact Form -->
      <div class="split-right">
        <div class="form-wrapper">
          <p class="contact-subtitle">We would love to hear from you!</p>

          <form id="contactForm" class="contact-form" name="contact" method="post" data-netlify="true"
            netlify-honeypot="bot-field" action="/contact-us/thankyou.html">
            <input type="hidden" name="form-name" value="contact" />

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your name" required />

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required />

            <label>Message</label>
            <textarea name="message" placeholder="Your Message" required></textarea>

            <button type="submit" class="send-btn"> Send Message <span class="arrow">→ </span></button>
          </form>

          <div class="contact-details">
            <p>Phone: +91 88611 83457</p>
          </div>
        </div>
      </div>
    </div>
