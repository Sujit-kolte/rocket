<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../imgs/oldblacklogo.png" />
    <title>Admin Dashboard - STES Rocketry</title>
    <link rel="stylesheet" href="admin.css" />
</head>

<body>
    <!-- Login Section -->
    <div id="login-section" class="login-container">
        <div class="login-panel">
            <h1>Admin Login</h1>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="admin-email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="admin-password">
            </div>
            <button class="btn-primary" id="login-btn" style="width: 100%;">Login to Dashboard</button>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="hidden">
        <div class="container">
            <div class="dashboard-header">
                <h1>Admin Dashboard</h1>
                <button class="btn-danger" id="logout-btn">Logout</button>
            </div>

            <div class="controls">
                <select id="domain-select">
                    <option value="">Select Domain</option>
                    <option value="projects">Projects</option>
                    <option value="members">Members</option>
                    <option value="sponsors">Sponsors</option>
                    <option value="contact">Contact</option>
                </select>
                <button class="btn-success" id="add-new-btn">+ Add New</button>
            </div>

            <div id="cards-container">
                <div class="empty-state">
                    <h3>Select a domain to view cards</h3>
                    <p>Choose a domain from the dropdown above</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Item</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="item-form">
                <div id="form-fields"></div>
                <button type="submit" class="btn-primary" style="width: 100%;">Save</button>
            </form>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>

</html>
